name: Release Illustrator plugin

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Synchronize CEP manifest version
        run: npm run version:sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-candidate
          path: dist/

  increment-version:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Increment patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          npm run version:sync
          npm run lint
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Commit incremented version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CSXS/manifest.xml
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: increment version to v${VERSION} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Build incremented release
        run: npm run build && npm run package
      - name: Generate update manifest
        env:
          UPDATE_TAG: v${{ steps.version.outputs.version }}
        run: node scripts/generate-update-manifest.js
      - name: Publish incremented release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release create "${RELEASE_TAG}" \
            dist/signarama-helper-*.zip \
            dist/update.json \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$(git rev-parse HEAD)" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --latest
      - name: Verify release is publicly discoverable
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          for ATTEMPT in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              -H "User-Agent: Signarama-Illustrator-Helper-Updater" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --output release-response.json; then
              node -e "const r=require('./release-response.json'); if(r.draft || r.prerelease) process.exit(1); const names=r.assets.map(a=>a.name); for(const required of ['update.json', 'SHA256SUMS']) if(!names.includes(required)) throw new Error('Release is missing '+required); if(!names.some(n=>/\\.zip$/.test(n))) throw new Error('Release is missing plugin ZIP'); console.log('Verified public release', r.html_url);"
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "The release is not publicly visible. Automatic updates require a public repository and a published (not draft) release." >&2
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run package
      - run: node scripts/generate-update-manifest.js
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/signarama-helper-*.zip
            dist/update.json
            dist/SHA256SUMS
