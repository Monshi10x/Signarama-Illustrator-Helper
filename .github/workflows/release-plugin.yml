name: Release Illustrator plugin

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Synchronize CEP manifest version
        run: npm run version:sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-candidate
          path: dist/

  increment-version:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Increment patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          npm run version:sync
          npm run lint
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Commit incremented version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CSXS/manifest.xml
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: increment version to v${VERSION} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
      - name: Build incremented release
        run: npm run build && npm run package
      - name: Generate update manifest
        env:
          GITHUB_REF_NAME: v${{ steps.version.outputs.version }}
        run: node scripts/generate-update-manifest.js
      - name: Publish incremented release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/signarama-helper-*.zip
            dist/update.json
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run package
      - run: node scripts/generate-update-manifest.js
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/signarama-helper-*.zip
            dist/update.json
            dist/SHA256SUMS
